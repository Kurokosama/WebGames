<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔢 Slitherlink · Kids Game Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/games.css">
<link rel="stylesheet" href="style.css">
<!--seo:games-->
<link rel="canonical" href="https://kurokosama.github.io/WebGames/games/slitherlink/">
<meta name="description" content="Draw one closed loop that matches all the numbers!">
<meta property="og:title" content="🔢 Slitherlink · Kids Game Land">
<meta property="og:description" content="Draw one closed loop that matches all the numbers!">
<meta property="og:url" content="https://kurokosama.github.io/WebGames/games/slitherlink/">
<!--/seo:games-->
</head>
<body class="game-page">
<header class="game-header">
  <a class="btn back-btn" href="/">🏠 Home</a>
  <h1 class="game-title" id="game-title">🔢 Slitherlink</h1>
  <div class="header-controls">
    <div id="difficulty-wrap"></div>
    <button class="btn restart-btn" id="restart-btn">🔄 Restart</button>
  </div>
</header>
<main class="game-main">
  <div class="status-bar">
    <div class="stat">Lines: <b id="lines">0</b></div>
    <div class="stat">Clues satisfied: <b id="satisfied">0</b>/<b id="clue-total">0</b></div>
    <div class="stat">Puzzle: <b id="puzzle-name">1</b>/3</div>
  </div>

  <div class="game-area">
    <svg class="slither" id="board" viewBox="0 0 340 340"></svg>
  </div>

  <p class="how-to-play">💡 How to play: Click between two dots to draw or erase a line. Each number says how many lines must surround that square. Make <b>one single closed loop</b> that matches every clue — no extra loops!</p>
</main>
<div class="modal hidden" id="modal">
  <div class="modal-box">
    <h2 id="modal-title">🎉 You Win!</h2>
    <p id="modal-text"></p>
    <button class="btn play-btn" id="modal-btn">Play Again</button>
  </div>
</div>
<script src="/js/common.js"></script>
<script src="game.js"></script>
</body>
</html>

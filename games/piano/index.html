<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piano · Kids Game Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/games.css">
<link rel="stylesheet" href="style.css">
<!--seo:games-->
<link rel="canonical" href="https://kurokosama.github.io/WebGames/games/piano/">
<meta name="description" content="Play real notes on a mini piano — follow the lights!">
<meta property="og:title" content="Piano · Kids Game Land">
<meta property="og:description" content="Play real notes on a mini piano — follow the lights!">
<meta property="og:url" content="https://kurokosama.github.io/WebGames/games/piano/">
<!--/seo:games-->
</head>
<body class="game-page">
<header class="game-header">
  <a class="btn back-btn" href="/">🏠 Home</a>
  <h1 class="game-title" id="game-title">🎹 Piano</h1>
  <div class="header-controls">
    <div id="difficulty-wrap"></div>
    <button class="btn restart-btn" id="restart-btn">🔄 Restart</button>
  </div>
</header>

<main class="game-main">
  <div class="status-bar">
    <div class="stat">Notes played: <b id="notes">0</b></div>
    <div class="stat">Progress: <b id="progress">Free Play</b></div>
    <div class="stat">Best: <b id="best">0</b></div>
  </div>

  <div class="game-area">
    <div class="piano-wrap">
      <div class="melody-track hidden" id="melody-track"></div>
      <div class="piano" id="piano"></div>
    </div>
  </div>

  <p class="how-to-play">💡 How to play: Tap the colourful keys or press <b>A S D F G H J K</b> to play notes. In “Follow the Lights”, play the key that glows — finish Twinkle Twinkle Little Star to win! 🌟</p>
</main>

<div class="modal hidden" id="modal">
  <div class="modal-box">
    <h2 id="modal-title">🎉 You Win!</h2>
    <p id="modal-text"></p>
    <button class="btn play-btn" id="modal-btn">Play Again</button>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>纸牌接龙 · 额外游戏</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/games.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="game-page">
<header class="game-header">
  <a class="btn back-btn" href="/retro-games.html">🕹️ 怀旧游戏</a>
  <h1 class="game-title" id="game-title">🃏 纸牌接龙</h1>
  <div class="header-controls">
    <div id="difficulty-wrap"></div>
    <button class="btn restart-btn" id="restart-btn">🔄 新游戏</button>
  </div>
</header>

<main class="game-main">
  <div class="status-bar">
    <div class="stat">分数: <b id="score">0</b></div>
    <div class="stat">步数: <b id="moves">0</b></div>
    <div class="stat">时间: <b id="timer">0:00</b></div>
  </div>

  <div class="game-area">
    <div id="solitaire-board">
      <div id="top-row">
        <div class="pile" id="stock" title="牌堆"></div>
        <div class="pile" id="waste" title="废牌堆"></div>
        <div class="spacer"></div>
        <div class="pile foundation" id="found-0" data-suit="♠"></div>
        <div class="pile foundation" id="found-1" data-suit="♥"></div>
        <div class="pile foundation" id="found-2" data-suit="♦"></div>
        <div class="pile foundation" id="found-3" data-suit="♣"></div>
      </div>
      <div id="tableau"></div>
    </div>
  </div>

  <p class="how-to-play">💡 玩法: 点击牌堆翻牌，将牌拖到同花色降序的牌堆上，目标是将所有牌按 A→K 排到四个基础堆上。</p>
</main>

<div class="modal hidden" id="modal">
  <div class="modal-box">
    <h2 id="modal-title">🎉 恭喜通关！</h2>
    <p id="modal-text"></p>
    <button class="btn play-btn" id="modal-btn">再来一局</button>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emoji Jigsaw · Kids Game Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/games.css">
<link rel="stylesheet" href="style.css">
<!--seo:games-->
<link rel="canonical" href="https://kurokosama.github.io/WebGames/games/jigsaw/">
<meta name="description" content="Swap the tiles and restore the hidden picture!">
<meta property="og:title" content="Emoji Jigsaw · Kids Game Land">
<meta property="og:description" content="Swap the tiles and restore the hidden picture!">
<meta property="og:url" content="https://kurokosama.github.io/WebGames/games/jigsaw/">
<!--/seo:games-->
</head>
<body class="game-page">
<header class="game-header">
  <a class="btn back-btn" href="/">🏠 Home</a>
  <h1 class="game-title" id="game-title">🧩 Emoji Jigsaw</h1>
  <div class="header-controls">
    <div id="difficulty-wrap"></div>
    <button class="btn restart-btn" id="restart-btn">🔄 Restart</button>
  </div>
</header>
<main class="game-main">
  <div class="status-bar">
    <div class="stat">Moves: <b id="moves">0</b></div>
    <div class="stat">Best moves: <b id="best">—</b></div>
  </div>
  <div class="game-area">
    <div class="jigsaw-wrap">
      <div class="board" id="board" aria-label="Puzzle board"></div>
      <aside class="reference">
        <h2>🖼️ Target picture</h2>
        <div class="ref-grid" id="reference" aria-label="Target picture"></div>
        <p class="ref-caption">A sunny garden 🌷</p>
      </aside>
    </div>
  </div>
  <p class="how-to-play">💡 How to play: Tap two tiles to swap them. Put every emoji back where it belongs to rebuild the garden. Green tiles are already in the right spot — the picture in the box shows where everything goes!</p>
</main>
<div class="modal hidden" id="modal">
  <div class="modal-box">
    <h2 id="modal-title">🎉 You Win!</h2>
    <p id="modal-text"></p>
    <button class="btn play-btn" id="modal-btn">Play Again</button>
  </div>
</div>
<script src="/js/common.js"></script>
<script src="game.js"></script>
</body>
</html>

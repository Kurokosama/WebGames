<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess the Number · Kids Game Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/games.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="game-page">
<header class="game-header">
  <a class="btn back-btn" href="/">🏠 Home</a>
  <h1 class="game-title" id="game-title">🔢 Guess the Number</h1>
  <div class="header-controls">
    <div id="difficulty-wrap"></div>
    <button class="btn restart-btn" id="restart-btn">🔄 Restart</button>
  </div>
</header>

<main class="game-main">
  <div class="status-bar">
    <div class="stat">Attempts: <b id="attempts">0</b></div>
    <div class="stat">Range: <b id="range">1 – 20</b></div>
  </div>

  <div class="secret-box">🤔 I’m thinking of a number…</div>

  <div class="guess-form">
    <input type="number" id="input" class="guess-input" placeholder="Type your guess" min="1">
    <button class="btn guess-btn" id="guess-btn">Guess!</button>
  </div>

  <div class="feedback" id="feedback">Start guessing to find my secret number!</div>

  <p class="how-to-play">💡 How to play: Type a number and press Guess. I’ll tell you if the secret number is higher or lower. Can you find it?</p>
</main>

<div class="modal hidden" id="modal">
  <div class="modal-box">
    <h2 id="modal-title">🎉 You Got It!</h2>
    <p id="modal-text"></p>
    <button class="btn play-btn" id="modal-btn">Play Again</button>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="game.js"></script>
</body>
</html>

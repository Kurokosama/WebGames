<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aeddf2"/>
      <stop offset="0.55" stop-color="#d7eecb"/>
      <stop offset="1" stop-color="#a9d684"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.82" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#fffbd2" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fffbd2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="0.5" stop-color="#ff5a3c"/>
      <stop offset="1" stop-color="#e23b8f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#23402c" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#sky)"/>
  <rect width="1200" height="420" fill="url(#sun)"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.78">
    <g transform="translate(190,80)"><circle r="26"/><circle cx="28" cy="6" r="20"/><circle cx="-28" cy="7" r="18"/><circle cx="8" cy="-10" r="17"/></g>
    <g transform="translate(940,60) scale(1.2)"><circle r="24"/><circle cx="26" cy="6" r="18"/><circle cx="-26" cy="7" r="17"/></g>
    <g transform="translate(560,46) scale(0.8)"><circle r="22"/><circle cx="24" cy="6" r="16"/><circle cx="-24" cy="7" r="15"/></g>
  </g>

  <!-- rolling hills -->
  <path d="M0,300 Q150,260 300,290 T600,285 T900,295 T1200,280 L1200,420 L0,420 Z" fill="#86bd6a" opacity="0.6"/>
  <path d="M0,340 Q200,310 400,335 T800,338 T1200,330 L1200,420 L0,420 Z" fill="#6aa552" opacity="0.7"/>

  <!-- isometric battlefield tiles -->
  <g transform="translate(600,330)" opacity="0.95">
    <!-- diamond tile grid -->
    <g stroke="#5f9f4a" stroke-opacity="0.45" fill="#9ace74">
      <g id="row">
        <polygon points="0,0 46,23 0,46 -46,23" fill="#a4d47e"/>
      </g>
    </g>
    <!-- a few tiles -->
    <g>
      <polygon points="-180,-40 -134,-17 -180,6 -226,-17" fill="#a4d47e" stroke="#6aa552"/>
      <polygon points="-134,-17 -88,6 -134,29 -180,6" fill="#9ace74" stroke="#6aa552"/>
      <polygon points="-88,6 -42,29 -88,52 -134,29" fill="#a8d884" stroke="#6aa552"/>
      <!-- ore tile -->
      <polygon points="-42,29 4,52 -42,75 -88,52" fill="#c9a23a" stroke="#9c7a22"/>
      <polygon points="-30,40 -24,28 -18,40 -24,46" fill="#ffd24a"/>
      <polygon points="-14,46 -8,34 -2,46 -8,52" fill="#ffe08a"/>
    </g>

    <!-- a base building (iso box) -->
    <g transform="translate(120,-30)" filter="url(#soft)">
      <polygon points="0,40 44,18 88,40 44,62" fill="#d8d2c2"/>            <!-- pad -->
      <polygon points="44,18 44,-26 88,-4 88,40" fill="#e2dccd"/>           <!-- right wall -->
      <polygon points="44,18 0,40 0,-4 44,-26" fill="#cfc8b8"/>            <!-- left wall -->
      <polygon points="0,-4 44,-26 88,-4 44,18" fill="#f4efe4"/>           <!-- roof -->
      <polygon points="0,-4 44,-26 88,-4 44,18" fill="#4f9dff" opacity="0.5"/>
      <circle cx="44" cy="-4" r="6" fill="#2d3a44"/>
      <line x1="44" y1="-4" x2="64" y2="-16" stroke="#7a8088" stroke-width="3"/>
      <ellipse cx="66" cy="-17" rx="7" ry="4" fill="#cfd6dd"/>
    </g>

    <!-- a tank (iso) -->
    <g transform="translate(-30,30) scale(1.1)">
      <ellipse cx="0" cy="14" rx="22" ry="9" fill="#23402c" opacity="0.22"/>
      <polygon points="-18,8 0,-1 18,8 0,17" fill="#3a3a3a"/>
      <polygon points="-14,2 0,-5 14,2 0,9" fill="#ff7a55"/>
      <polygon points="0,-5 14,2 14,-4 0,-11" fill="#cc4a30"/>
      <polygon points="-14,2 0,-5 0,-11 -14,-4" fill="#e0603a"/>
      <ellipse cx="0" cy="-9" rx="9" ry="5" fill="#ff8a5a"/>
      <line x1="0" y1="-9" x2="22" y2="-3" stroke="#262626" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- title -->
  <text x="600" y="160" text-anchor="middle" font-size="92" font-weight="900" letter-spacing="8"
        fill="url(#title)" filter="url(#soft)">CRIMSON TIDE</text>
  <text x="600" y="200" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="6" fill="#2f7a9c">
    AN OPEN&#8209;SOURCE REAL&#8209;TIME STRATEGY GAME
  </text>
  <g transform="translate(600,232)" font-size="13" font-weight="700" fill="#2b4636" text-anchor="middle">
    <text>⚔ 3 FACTIONS &#160;&#160;·&#160;&#160; 🎖 6&#8209;MISSION CAMPAIGN &#160;&#160;·&#160;&#160; 🧊 ISOMETRIC 2.5D &#160;&#160;·&#160;&#160; 🌫 FOG OF WAR</text>
  </g>
</svg>

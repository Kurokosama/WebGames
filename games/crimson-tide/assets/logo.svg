<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="0.5" stop-color="#ff5a3c"/>
      <stop offset="1" stop-color="#e23b8f"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#eaf4e6"/>
      <stop offset="1" stop-color="#cfe6cf"/>
    </radialGradient>
  </defs>

  <circle cx="160" cy="160" r="150" fill="url(#ring)"/>
  <circle cx="160" cy="160" r="128" fill="url(#disc)"/>

  <!-- isometric crystal / tide emblem -->
  <g transform="translate(160,168)">
    <!-- ground diamond -->
    <polygon points="0,40 74,4 0,-32 -74,4" fill="#a4d47e" stroke="#6aa552" stroke-width="2"/>
    <!-- water wedge (the 'tide') -->
    <path d="M-74,4 L0,40 L74,4 L0,18 Z" fill="#7fc0e0" opacity="0.85"/>
    <!-- crimson crystal spire -->
    <polygon points="0,-92 26,-6 0,8 -26,-6" fill="#ff6a4a"/>
    <polygon points="0,-92 26,-6 0,8" fill="#e23b3b"/>
    <polygon points="0,-92 -26,-6 0,8" fill="#ff8a5a"/>
    <polygon points="0,8 26,-6 0,2 -26,-6" fill="#c52f2f"/>
  </g>

  <!-- arc text -->
  <path id="arc" d="M 44 160 A 116 116 0 0 1 276 160" fill="none"/>
  <text font-size="27" font-weight="900" letter-spacing="5" fill="#ffffff">
    <textPath href="#arc" startOffset="50%" text-anchor="middle">CRIMSON TIDE</textPath>
  </text>
</svg>

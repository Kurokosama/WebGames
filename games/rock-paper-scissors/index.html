<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors · Kids Game Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/games.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="game-page">
<header class="game-header">
  <a class="btn back-btn" href="/">🏠 Home</a>
  <h1 class="game-title" id="game-title">✊ Rock Paper Scissors</h1>
  <div class="header-controls">
    <div id="difficulty-wrap"></div>
    <button class="btn restart-btn" id="restart-btn">🔄 Restart</button>
  </div>
</header>

<main class="game-main">
  <div class="status-bar">
    <div class="stat">You: <b id="you">0</b></div>
    <div class="stat">Computer: <b id="computer">0</b></div>
    <div class="stat">Ties: <b id="ties">0</b></div>
  </div>

  <div class="vs-area">
    <div class="choice-box">
      <div class="choice-label">You</div>
      <div class="choice-emoji" id="your-choice">🤚</div>
    </div>
    <div class="vs-text">VS</div>
    <div class="choice-box">
      <div class="choice-label">Computer</div>
      <div class="choice-emoji" id="comp-choice">🤖</div>
    </div>
  </div>

  <div class="result-banner" id="result">Pick your move to start!</div>

  <div class="move-buttons">
    <button class="move-btn" data-move="rock" onclick="play('rock')"><span class="move-emoji">✊</span>Rock</button>
    <button class="move-btn" data-move="paper" onclick="play('paper')"><span class="move-emoji">✋</span>Paper</button>
    <button class="move-btn" data-move="scissors" onclick="play('scissors')"><span class="move-emoji">✌️</span>Scissors</button>
  </div>

  <p class="how-to-play">💡 How to play: Rock beats scissors, scissors beats paper, paper beats rock. First to <b>5</b> wins takes the match!</p>
</main>

<div class="modal hidden" id="modal">
  <div class="modal-box">
    <h2 id="modal-title">🎉 You Win!</h2>
    <p id="modal-text"></p>
    <button class="btn play-btn" id="modal-btn">Play Again</button>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="game.js"></script>
</body>
</html>

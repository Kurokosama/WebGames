<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔺 Pyramid Solitaire · Kids Game Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/games.css">
<link rel="stylesheet" href="style.css">
<!--seo:games-->
<link rel="canonical" href="https://kurokosama.github.io/WebGames/games/pyramid-solitaire/">
<meta name="description" content="Remove pairs of free cards that add up to 13!">
<meta property="og:title" content="🔺 Pyramid Solitaire · Kids Game Land">
<meta property="og:description" content="Remove pairs of free cards that add up to 13!">
<meta property="og:url" content="https://kurokosama.github.io/WebGames/games/pyramid-solitaire/">
<!--/seo:games-->
</head>
<body class="game-page">
<header class="game-header">
  <a class="btn back-btn" href="/">🏠 Home</a>
  <h1 class="game-title" id="game-title">🔺 Pyramid Solitaire</h1>
  <div class="header-controls">
    <div id="difficulty-wrap"></div>
    <button class="btn restart-btn" id="restart-btn">🔄 Restart</button>
  </div>
</header>
<main class="game-main">
  <div class="status-bar">
    <div class="stat">Cards left: <b id="left">28</b></div>
    <div class="stat">Score: <b id="score">0</b></div>
    <div class="stat">Best: <b id="best">0</b></div>
  </div>

  <div class="game-area">
    <div class="stock-row">
      <div class="pile-box">
        <div class="stack" id="stock"></div>
        <span class="pile-label">Stock</span>
      </div>
      <div class="pile-box">
        <div class="waste" id="waste"></div>
        <span class="pile-label">Waste</span>
      </div>
      <div class="pile-box">
        <div class="removed" id="removed"></div>
        <span class="pile-label">Removed</span>
      </div>
    </div>
    <div class="pyramid" id="pyramid"></div>
  </div>

  <p class="how-to-play">💡 How to play: Remove two <b>free cards</b> that add up to 13 (K=13, Q=12, J=11, 10=10…). When you cannot find a pair, draw from the stock. Clear the whole pyramid to win!</p>
</main>
<div class="modal hidden" id="modal">
  <div class="modal-box">
    <h2 id="modal-title">🎉 You Win!</h2>
    <p id="modal-text"></p>
    <button class="btn play-btn" id="modal-btn">Play Again</button>
  </div>
</div>
<script src="/js/common.js"></script>
<script src="game.js"></script>
</body>
</html>

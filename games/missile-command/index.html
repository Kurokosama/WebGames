<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 Missile Command · Kids Game Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/games.css">
<link rel="stylesheet" href="style.css">
<!--seo:games-->
<link rel="canonical" href="https://kurokosama.github.io/WebGames/games/missile-command/">
<meta name="description" content="Defend your cities from the falling missiles!">
<meta property="og:title" content="🚀 Missile Command · Kids Game Land">
<meta property="og:description" content="Defend your cities from the falling missiles!">
<meta property="og:url" content="https://kurokosama.github.io/WebGames/games/missile-command/">
<!--/seo:games-->
</head>
<body class="game-page">
<header class="game-header">
  <a class="btn back-btn" href="/">🏠 Home</a>
  <h1 class="game-title" id="game-title">🚀 Missile Command</h1>
  <div class="header-controls">
    <div id="difficulty-wrap"></div>
    <button class="btn restart-btn" id="restart-btn">🔄 Restart</button>
  </div>
</header>
<main class="game-main">
  <div class="status-bar">
    <div class="stat">Score: <b id="score">0</b></div>
    <div class="stat">Cities: <b id="cities">6</b></div>
    <div class="stat">Wave: <b id="wave">1</b>/5</b></div>
    <div class="stat">Best: <b id="best">0</b></div>
  </div>

  <div class="game-area">
    <canvas id="canvas" width="620" height="600"></canvas>
  </div>

  <p class="how-to-play">💡 How to play: <b>Click or tap</b> anywhere to fire a missile from your base at that spot. Every explosion destroys the enemy missiles inside its circle! Protect your 6 cities through <b>5 waves</b> — lose them all and it's game over.</p>
</main>
<div class="modal hidden" id="modal">
  <div class="modal-box">
    <h2 id="modal-title">🎉 You Win!</h2>
    <p id="modal-text"></p>
    <button class="btn play-btn" id="modal-btn">Play Again</button>
  </div>
</div>
<script src="/js/common.js"></script>
<script src="game.js"></script>
</body>
</html>

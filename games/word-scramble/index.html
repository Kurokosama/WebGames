<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Scramble · Kids Game Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/games.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="game-page">
<header class="game-header">
  <a class="btn back-btn" href="/">🏠 Home</a>
  <h1 class="game-title" id="game-title">🔤 Word Scramble</h1>
  <div class="header-controls">
    <div id="difficulty-wrap"></div>
    <button class="btn restart-btn" id="restart-btn">🔄 Restart</button>
  </div>
</header>

<main class="game-main">
  <div class="status-bar">
    <div class="stat">Words: <b id="score">0</b></div>
    <div class="stat">Round: <b id="progress">1/10</b></div>
  </div>

  <div class="word-progress" id="dots"></div>

  <div class="answer-row" id="answer"></div>

  <div class="letter-row" id="letters"></div>

  <div class="actions">
    <button class="btn reset-letter-btn" id="clear-btn">🧹 Clear</button>
  </div>

  <div class="feedback" id="feedback">Click the letters to build the word!</div>

  <p class="how-to-play">💡 How to play: The letters are all mixed up! Click the letter tiles to spell the word correctly.</p>
</main>

<div class="modal hidden" id="modal">
  <div class="modal-box">
    <h2 id="modal-title">🎉 Round Complete!</h2>
    <p id="modal-text"></p>
    <button class="btn play-btn" id="modal-btn">Play Again</button>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="game.js"></script>
</body>
</html>

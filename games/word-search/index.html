<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Search · Kids Game Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/games.css">
<link rel="stylesheet" href="style.css">
<!--seo:games-->
<link rel="canonical" href="https://kurokosama.github.io/WebGames/games/word-search/">
<meta name="description" content="Find the hidden words in the letter grid!">
<meta property="og:title" content="Word Search · Kids Game Land">
<meta property="og:description" content="Find the hidden words in the letter grid!">
<meta property="og:url" content="https://kurokosama.github.io/WebGames/games/word-search/">
<!--/seo:games-->
</head>
<body class="game-page">
<header class="game-header">
  <a class="btn back-btn" href="/">🏠 Home</a>
  <h1 class="game-title" id="game-title">🔍 Word Search</h1>
  <div class="header-controls">
    <div id="difficulty-wrap"></div>
    <button class="btn restart-btn" id="restart-btn">🔄 Restart</button>
  </div>
</header>
<main class="game-main">
  <div class="status-bar">
    <div class="stat">Found: <b id="found-count">0</b></div>
    <div class="stat">Total: <b id="total-count">8</b></div>
    <div class="stat">Best: <b id="best-count">—</b></div>
  </div>
  <div class="game-area">
    <div class="ws-layout">
      <div class="ws-board" id="board"></div>
      <ul class="word-list" id="word-list"></ul>
    </div>
  </div>
  <p class="how-to-play">💡 How to play: Tap the first letter of a word, then tap the last letter. If the line between them spells a word from the list, it is found! Words hide horizontally, vertically, or diagonally. Find all 8 to win.</p>
</main>
<div class="modal hidden" id="modal">
  <div class="modal-box">
    <h2 id="modal-title">🎉 You Win!</h2>
    <p id="modal-text"></p>
    <button class="btn play-btn" id="modal-btn">Play Again</button>
  </div>
</div>
<script src="/js/common.js"></script>
<script src="game.js"></script>
</body>
</html>

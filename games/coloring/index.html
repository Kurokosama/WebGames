<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🖍️ Coloring Book · Kids Game Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/games.css">
<link rel="stylesheet" href="style.css">
<!--seo:games-->
<link rel="canonical" href="https://kurokosama.github.io/WebGames/games/coloring/">
<meta name="description" content="Pick crayon colors and fill in the picture!">
<meta property="og:title" content="🖍️ Coloring Book · Kids Game Land">
<meta property="og:description" content="Pick crayon colors and fill in the picture!">
<meta property="og:url" content="https://kurokosama.github.io/WebGames/games/coloring/">
<!--/seo:games-->
</head>
<body class="game-page">
<header class="game-header">
  <a class="btn back-btn" href="/">🏠 Home</a>
  <h1 class="game-title" id="game-title">🖍️ Coloring Book</h1>
  <div class="header-controls">
    <div id="difficulty-wrap"></div>
    <button class="btn restart-btn" id="restart-btn">🔄 Restart</button>
  </div>
</header>
<main class="game-main">
  <div class="status-bar">
    <div class="stat">Colored: <b id="filled">0</b></div>
    <div class="stat">Total: <b id="total">0</b></div>
    <div class="stat">Best: <b id="best">0%</b></div>
  </div>

  <div class="palette" id="palette"></div>

  <div class="game-area">
    <div class="picture-wrap">
      <svg id="picture" viewBox="0 0 200 200" role="img" aria-label="Coloring picture"></svg>
    </div>
  </div>

  <div class="tools">
    <button class="btn undo-btn" id="undo-btn">↩️ Undo</button>
    <button class="btn play-btn" id="new-btn">🖼️ New picture</button>
  </div>

  <p class="how-to-play">💡 How to play: Pick a <b>crayon color</b>, then click any part of the picture to fill it in! Color the whole picture, then press <b>New picture</b> for another one.</p>
</main>
<div class="modal hidden" id="modal">
  <div class="modal-box">
    <h2 id="modal-title">🎉 You Win!</h2>
    <p id="modal-text"></p>
    <button class="btn play-btn" id="modal-btn">Play Again</button>
  </div>
</div>
<script src="/js/common.js"></script>
<script src="game.js"></script>
</body>
</html>

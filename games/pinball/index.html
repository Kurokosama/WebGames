<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弹珠台 · 额外游戏</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/games.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="game-page">
<header class="game-header">
  <a class="btn back-btn" href="/retro-games.html">🕹️ 怀旧游戏</a>
  <h1 class="game-title" id="game-title">🎯 弹珠台</h1>
  <div class="header-controls">
    <div id="difficulty-wrap"></div>
    <button class="btn restart-btn" id="restart-btn">🔄 重新开始</button>
  </div>
</header>

<main class="game-main">
  <div class="status-bar">
    <div class="stat">分数: <b id="score">0</b></div>
    <div class="stat">最高: <b id="best">0</b></div>
    <div class="stat">球数: <b id="balls">3</b></div>
  </div>

  <div class="game-area">
    <canvas id="canvas"></canvas>
  </div>

  <p class="how-to-play">💡 玩法: 按 <b>空格键</b> 发射弹珠，<b>←→</b> 或 <b>A/D</b> 控制挡板。击中目标得分，别让球掉下去！</p>
</main>

<div class="modal hidden" id="modal">
  <div class="modal-box">
    <h2 id="modal-title">🎮 游戏结束</h2>
    <p id="modal-text"></p>
    <button class="btn play-btn" id="modal-btn">再来一局</button>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="game.js"></script>
</body>
</html>

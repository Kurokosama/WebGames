<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💣 Bomberman · Kids Game Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/games.css">
<link rel="stylesheet" href="style.css">
<!--seo:games-->
<link rel="canonical" href="https://kurokosama.github.io/WebGames/games/bomberman/">
<meta name="description" content="Place bombs, break bricks, find the exit!">
<meta property="og:title" content="💣 Bomberman · Kids Game Land">
<meta property="og:description" content="Place bombs, break bricks, find the exit!">
<meta property="og:url" content="https://kurokosama.github.io/WebGames/games/bomberman/">
<!--/seo:games-->
</head>
<body class="game-page">
<header class="game-header">
  <a class="btn back-btn" href="/">🏠 Home</a>
  <h1 class="game-title" id="game-title">💣 Bomberman</h1>
  <div class="header-controls">
    <div id="difficulty-wrap"></div>
    <button class="btn restart-btn" id="restart-btn">🔄 Restart</button>
  </div>
</header>
<main class="game-main">
  <div class="status-bar">
    <div class="stat">Score: <b id="score">0</b></div>
    <div class="stat">Lives: <b id="lives">3</b></div>
    <div class="stat">Level: <b id="level">1</b></div>
    <div class="stat">Best: <b id="best">0</b></div>
  </div>

  <div class="game-area">
    <canvas id="canvas" width="624" height="432"></canvas>
  </div>

  <div class="touch-controls">
    <button class="tc-btn" data-act="up" aria-label="Up">▲</button>
    <button class="tc-btn" data-act="left" aria-label="Left">◀</button>
    <button class="tc-btn" data-act="down" aria-label="Down">▼</button>
    <button class="tc-btn" data-act="right" aria-label="Right">▶</button>
    <button class="tc-btn bomb" data-act="bomb" aria-label="Place bomb">💣</button>
  </div>

  <p class="how-to-play">💡 How to play: Move with the <b>arrow keys</b>, <b>WASD</b>, or the on-screen arrows, and press <b>Space</b> or 💣 to drop a bomb. Blow up the bricks to find the <b>exit door</b> — grab the coins, avoid the enemies, then reach the exit!</p>
</main>
<div class="modal hidden" id="modal">
  <div class="modal-box">
    <h2 id="modal-title">🎉 You Win!</h2>
    <p id="modal-text"></p>
    <button class="btn play-btn" id="modal-btn">Play Again</button>
  </div>
</div>
<script src="/js/common.js"></script>
<script src="game.js"></script>
</body>
</html>

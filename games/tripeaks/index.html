<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⛰️ TriPeaks · Kids Game Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/games.css">
<link rel="stylesheet" href="style.css">
<!--seo:games-->
<link rel="canonical" href="https://kurokosama.github.io/WebGames/games/tripeaks/">
<meta name="description" content="Clear three peaks by picking the next card up or down!">
<meta property="og:title" content="⛰️ TriPeaks · Kids Game Land">
<meta property="og:description" content="Clear three peaks by picking the next card up or down!">
<meta property="og:url" content="https://kurokosama.github.io/WebGames/games/tripeaks/">
<!--/seo:games-->
</head>
<body class="game-page">
<header class="game-header">
  <a class="btn back-btn" href="/">🏠 Home</a>
  <h1 class="game-title" id="game-title">⛰️ TriPeaks</h1>
  <div class="header-controls">
    <div id="difficulty-wrap"></div>
    <button class="btn restart-btn" id="restart-btn">🔄 Restart</button>
  </div>
</header>
<main class="game-main">
  <div class="status-bar">
    <div class="stat">Cards left: <b id="left">28</b></div>
    <div class="stat">Current: <b id="current">K</b></div>
    <div class="stat">Moves: <b id="moves">0</b></div>
    <div class="stat">Best: <b id="best">0</b></div>
  </div>

  <div class="game-area">
    <div class="board-area">
      <div class="tripeaks" id="peaks"></div>
      <div class="bottom-row">
        <div class="stock-box">
          <div class="stack" id="stock"></div>
          <span class="pile-label">Stock</span>
        </div>
        <div class="current-card" id="current-card"></div>
        <div class="stock-box">
          <div class="stack" id="waste"></div>
          <span class="pile-label">Waste</span>
        </div>
      </div>
    </div>
  </div>

  <p class="how-to-play">💡 How to play: Tap a card that is <b>one higher or one lower</b> than the current card (you start at King). Cards with a card on top cannot be taken. Draw from the stock when you are stuck — clear every card to win!</p>
</main>
<div class="modal hidden" id="modal">
  <div class="modal-box">
    <h2 id="modal-title">🎉 You Win!</h2>
    <p id="modal-text"></p>
    <button class="btn play-btn" id="modal-btn">Play Again</button>
  </div>
</div>
<script src="/js/common.js"></script>
<script src="game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏀 Basketball Shoot · Kids Game Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/games.css">
<link rel="stylesheet" href="style.css">
<!--seo:games-->
<link rel="canonical" href="https://kurokosama.github.io/WebGames/games/basketball/">
<meta name="description" content="Set the angle and power — sink the baskets!">
<meta property="og:title" content="🏀 Basketball Shoot · Kids Game Land">
<meta property="og:description" content="Set the angle and power — sink the baskets!">
<meta property="og:url" content="https://kurokosama.github.io/WebGames/games/basketball/">
<!--/seo:games-->
</head>
<body class="game-page">
<header class="game-header">
  <a class="btn back-btn" href="/">🏠 Home</a>
  <h1 class="game-title" id="game-title">🏀 Basketball Shoot</h1>
  <div class="header-controls">
    <div id="difficulty-wrap"></div>
    <button class="btn restart-btn" id="restart-btn">🔄 Restart</button>
  </div>
</header>
<main class="game-main">
  <div class="status-bar">
    <div class="stat">Shots made: <b id="made">0</b></div>
    <div class="stat">Shots left: <b id="left">20</b></div>
    <div class="stat">Streak: <b id="streak">0</b></div>
    <div class="stat">Best: <b id="best">0</b></div>
  </div>

  <div class="game-area">
    <canvas id="canvas" width="560" height="520"></canvas>
  </div>

  <div class="controls">
    <label>Angle: <input type="range" id="angle" min="20" max="80" value="55"></label>
    <label>Power: <input type="range" id="power" min="30" max="100" value="65"></label>
    <button class="btn play-btn" id="shoot-btn">🏀 Shoot!</button>
  </div>

  <p class="how-to-play">💡 How to play: Set the <b>angle</b> and <b>power</b>, then press <b>Shoot</b>! The ball flies in a real arc — line up your shot to sink it. Try to make <b>10 of 20</b> shots for a celebration!</p>
</main>
<div class="modal hidden" id="modal">
  <div class="modal-box">
    <h2 id="modal-title">🎉 You Win!</h2>
    <p id="modal-text"></p>
    <button class="btn play-btn" id="modal-btn">Play Again</button>
  </div>
</div>
<script src="/js/common.js"></script>
<script src="game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drawing Pad · Kids Game Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/games.css">
<link rel="stylesheet" href="style.css">
<!--seo:games-->
<link rel="canonical" href="https://kurokosama.github.io/WebGames/games/drawing/">
<meta name="description" content="Draw anything you like with bright colors!">
<meta property="og:title" content="Drawing Pad · Kids Game Land">
<meta property="og:description" content="Draw anything you like with bright colors!">
<meta property="og:url" content="https://kurokosama.github.io/WebGames/games/drawing/">
<!--/seo:games-->
</head>
<body class="game-page">
<header class="game-header">
  <a class="btn back-btn" href="/">🏠 Home</a>
  <h1 class="game-title" id="game-title">🎨 Drawing Pad</h1>
  <div class="header-controls">
    <div id="difficulty-wrap"></div>
    <button class="btn restart-btn" id="restart-btn">🔄 Restart</button>
  </div>
</header>

<main class="game-main">
  <div class="status-bar">
    <div class="stat">Strokes: <b id="strokes">0</b></div>
    <div class="stat">Best: <b id="best">0</b></div>
    <div class="stat">Pen: <b id="pen-name">Red</b></div>
  </div>

  <div class="game-area">
    <div class="drawing-wrap">
      <div class="toolbar">
        <div class="palette" id="palette" aria-label="Colors"></div>
        <div class="sizes" id="sizes" aria-label="Brush size"></div>
        <button class="btn tool-btn" id="eraser-btn">🧽 Eraser</button>
        <button class="btn clear-btn" id="clear-btn">🗑️ Clear</button>
      </div>

      <canvas id="canvas" width="900" height="600" aria-label="Drawing paper"></canvas>

      <div class="cheer hidden" id="cheer" role="status"></div>
    </div>
  </div>

  <p class="how-to-play">💡 How to play: Pick a colour and a brush size, then draw on the paper with your finger or mouse. Use the eraser to rub things out, and Clear to start a new picture. Every 50 strokes you get a cheer! 🎉</p>
</main>

<div class="modal hidden" id="modal">
  <div class="modal-box">
    <h2 id="modal-title">🎉 You Win!</h2>
    <p id="modal-text"></p>
    <button class="btn play-btn" id="modal-btn">Play Again</button>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="game.js"></script>
</body>
</html>

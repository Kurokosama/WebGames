<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess · Kids Game Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/games.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="game-page">
<header class="game-header">
  <a class="btn back-btn" href="/">🏠 Home</a>
  <h1 class="game-title" id="game-title">♟️ Chess</h1>
  <div class="header-controls">
    <div id="difficulty-wrap"></div>
    <button class="btn restart-btn" id="restart-btn">🔄 Restart</button>
  </div>
</header>

<main class="game-main">
  <div class="status-bar">
    <div class="stat">Turn: <b id="turn">White</b></div>
    <div class="stat" id="check-stat">Check: <b id="check">—</b></div>
    <div class="stat">You: <b id="player">0</b></div>
    <div class="stat">Computer: <b id="computer">0</b></div>
  </div>

  <div class="mode-bar">
    <button class="mode-btn active" id="mode-ai" onclick="setMode('ai')">🤖 vs Computer</button>
    <button class="mode-btn" id="mode-2p" onclick="setMode('2p')">👥 Two Players</button>
  </div>

  <div class="game-area">
    <div class="board" id="board"></div>
  </div>

  <p class="how-to-play">💡 How to play: Click a piece, then click a highlighted square to move it. White moves first. Capture the king to win! Castling, en passant, and promotion are all supported.</p>
</main>

<div class="modal hidden" id="modal">
  <div class="modal-box">
    <h2 id="modal-title">🎉 Game Over</h2>
    <p id="modal-text"></p>
    <button class="btn play-btn" id="modal-btn">Play Again</button>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="game.js"></script>
</body>
</html>
